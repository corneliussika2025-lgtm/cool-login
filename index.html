<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-circle bg1"></div>
  <div class="bg-circle bg2"></div>
  <div class="bg-circle bg3"></div>

  <main class="card">
    <!-- LOGIN -->
    <section id="loginView" class="view active">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 0 1 6 0v3H9z"/></svg></div>
      <h1>Welcome</h1>
      <p class="sub">Login to continue your journey</p>
      <form id="loginForm" novalidate>
        <div class="field"><input type="email" id="loginEmail" placeholder="Email Address" autocomplete="email" required></div>
        <div class="field">
          <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
          <button type="button" class="eye" data-target="loginPassword" aria-label="Show password">&#128065;</button>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="remember"> Remember me</label>
          <a href="#" id="forgotLink">Forgot Password?</a>
        </div>
        <button type="submit" class="btn" id="loginBtn">Login</button>
      </form>
      <p class="msg" id="loginMsg" role="alert"></p>
      <div class="switch">Don't have an account? <button type="button" class="round" id="toSignup" aria-label="Create account">+</button></div>
    </section>

    <!-- SIGN UP -->
    <section id="signupView" class="view">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-8 2.2-8 5v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1c0-2.8-3.6-5-8-5z"/></svg></div>
      <h1>Create Account</h1>
      <p class="sub">Start your journey with us</p>
      <form id="signupForm" novalidate>
        <div class="field"><input type="text" id="signupName" placeholder="Full Name" autocomplete="name" required></div>
        <div class="field"><input type="email" id="signupEmail" placeholder="Email Address" autocomplete="email" required></div>
        <div class="field">
          <input type="password" id="signupPassword" placeholder="Password" autocomplete="new-password" required>
          <button type="button" class="eye" data-target="signupPassword" aria-label="Show password">&#128065;</button>
        </div>
        <div class="field"><input type="password" id="signupConfirm" placeholder="Confirm Password" autocomplete="new-password" required></div>
        <button type="submit" class="btn" id="signupBtn">Create Account</button>
      </form>
      <p class="msg" id="signupMsg" role="alert"></p>
      <div class="switch">Already have an account? <button type="button" class="round" id="toLogin" aria-label="Back to login">&#8592;</button></div>
    </section>

    <!-- LOGGED IN -->
    <section id="welcomeView" class="view">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></div>
      <h1>You're in!</h1>
      <p class="sub" id="welcomeText"></p>
      <button type="button" class="btn" id="logoutBtn">Log out</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="script.js"></script>
</body>
</html>
